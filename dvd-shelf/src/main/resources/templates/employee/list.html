<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
	    <meta charset="UTF-8">
	    <title>Employees</title>
	    <th:block th:replace="~{fragments/layout :: head}"></th:block>
	</head>
	
	<body class="text-white">
	
		<nav th:replace="~{fragments/layout :: navbar}"></nav>
		
		<div class="container mt-5">
		
			<h1 class="text-center">Employees</h1>
			
			<div sec:authorize="hasRole('ADMIN')">
				<a th:href="@{/employee/register}" class="btn btn-secondary">Register New Employee</a>
			</div>
			
			<hr>
			
			<div class="text-center" th:if="${#lists.isEmpty(employees)}">
				<p>There are no employees to display.</p>
			</div>
			
			<table class="table table-striped" th:if="${!#lists.isEmpty(employees)}">
			
				<thead>
					<tr>
						<th scope="col">#</th>
						<th scope="col">Employee Name</th>
						<th scope="col">Actions</th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="employee, emplNum : ${employees}">
						<td th:text="${emplNum.count}">1</td>
						<td th:text="${employee.firstName + ' ' + employee.lastName}">Name</td>
						<td>
							<a class="btn btn-secondary btn-sm disabled"
							   th:href="@{/employee/{id}(id=${employee.id})}">View</a>
							<a class="btn btn-warning btn-sm disabled"
							   th:href="@{/employee/{id}/edit(id=${employee.id})}">Edit</a>
							   
							<form th:action="@{/employee/{id}/delete(id=${employee.id})}"
								  method="post"
								  onsubmit="return confirm('Are you sure you want to delete this employee?');"
								  style="display: inline;">
								<button type="submit" class="btn btn-danger btn-sm">Delete</button>
							</form>
						</td>
					</tr>
				</tbody>
			
			</table>
		
		</div>
	
	</body>
	   
</html>
